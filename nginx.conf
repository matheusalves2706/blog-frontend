server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Arquivos estáticos com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html nunca deve ser cacheado (bundle pode mudar).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback de SPA: qualquer rota (ex.: /posts/1) devolve o index.html
    # para o react-router assumir a navegação no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
